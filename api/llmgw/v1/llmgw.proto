syntax = "proto3";

package llmgw.v1;

option go_package = "github.com/choucisan/ai-gaokao-counselor/api/llmgw/v1;llmgwv1";

import "api/common/v1/common.proto";
import "google/protobuf/struct.proto";

// svc-llm-gateway（Go）实现；svc-orchestrator 调用。
// 职责：按 role 路由模型、缓存、预算闸门、重试/降级、成本记账。**模型 key 只存在于此服务。**
// 关键约束：本服务直连模型厂商，**绝不回调 svc-orchestrator**（否则破坏 DAG）。
service LLMGateway {
  rpc Chat(ChatRequest) returns (ChatResponse);
  rpc StreamChat(ChatRequest) returns (stream ChatDelta);
}

message Msg {
  string role    = 1; // system | user | assistant
  string content = 2;
}

// 项目统一六类数据分类。SENSITIVE_ELIGIBILITY_DATA 与 SECRET 永不进入云模型。
enum DataClassification {
  DATA_CLASSIFICATION_UNSPECIFIED = 0;
  PUBLIC_DATA                    = 1;
  PRINCIPAL_DATA                 = 2;
  INQUIRY_DATA                   = 3;
  SENSITIVE_ELIGIBILITY_DATA     = 4;
  OPERATIONAL_DATA               = 5;
  SECRET                         = 6;
}

message ChatRequest {
  common.v1.Trace trace      = 1;
  string          role       = 2; // profile|strategy|critic|report|verify —— 据此路由模型
  repeated Msg    messages   = 3;
  string          json_schema = 4; // 旧字段仅保留 wire 兼容；不能授权或覆盖已注册 schema
  double          temperature = 5;
  int32           max_tokens  = 6;
  int32           timeout_ms  = 7;

  // 以下字段只补充调用身份与治理引用；principal_id 只从可信 metadata 读取。
  string session_id              = 8;
  string run_id                  = 9;
  string release_id              = 10;
  string logical_call_id         = 11;
  string prompt_template_key     = 12;
  string prompt_template_version = 13;
  string response_schema_key     = 14; // 结构化调用必须引用已注册版本
  string response_schema_version = 15;
  string data_classification     = 16; // 旧 string wire；仅兼容此前的六类值及 PUBLIC/INTERNAL/SENSITIVE
  map<string, string> prompt_variables = 17;
  DataClassification data_class = 18; // 新调用优先使用 typed enum；不得覆盖或放宽 route
}

message ChatResponse {
  // 1-5 保留旧客户端兼容语义；新客户端读取下方类型化字段。
  string content    = 1;
  string model      = 2;
  int32  in_tokens  = 3;
  int32  out_tokens = 4;
  double cost       = 5; // 已弃用的展示字段，不参与权威记账

  Usage usage                    = 6;
  Cost cost_detail               = 7;
  repeated AttemptSummary attempts = 8;
  string ledger_entry_id         = 9;
  string route_version           = 10;
  string price_table_version     = 11;
  string logical_call_id         = 12;
  bool cache_hit                 = 13;
  string finish_reason           = 14;
  string release_id              = 15;
  google.protobuf.Struct structured_output = 16;
  string prompt_template_key     = 17;
  string prompt_template_version = 18;
  string response_schema_key     = 19;
  string response_schema_version = 20;
}

message Usage {
  int64 input_tokens  = 1;
  int64 output_tokens = 2;
}

message Cost {
  string currency_unit          = 1; // USD_MICRO
  int64  reserved_micro_usd     = 2;
  int64  actual_micro_usd       = 3;
  string settlement_status      = 4; // SETTLED / PENDING_RECONCILIATION
}

message AttemptSummary {
  string attempt_id          = 1;
  string model_id            = 2;
  string provider            = 3;
  string status              = 4;
  int64  latency_ms          = 5;
  Usage  usage               = 6;
  int64  cost_micro_usd      = 7;
  string provider_request_id = 8;
  string error_code          = 9;
}

enum ChatStreamEventType {
  CHAT_STREAM_EVENT_TYPE_UNSPECIFIED = 0;
  CHAT_STREAM_EVENT_START            = 1;
  CHAT_STREAM_EVENT_DELTA            = 2;
  CHAT_STREAM_EVENT_USAGE            = 3;
  CHAT_STREAM_EVENT_DONE             = 4;
  CHAT_STREAM_EVENT_ERROR            = 5;
}

// sequence is local to one StreamChat call and is never a run event_seq.
message ChatStreamEvent {
  int64                 sequence               = 1;
  ChatStreamEventType   type                   = 2;
  string                logical_call_id        = 3;
  string                attempt_id             = 4;
  string                model_id               = 5;
  string                delta_text             = 6;
  string                finish_reason          = 7;
  Usage                 usage                  = 8;
  Cost                  cost                   = 9;
  string                ledger_entry_id        = 10;
  string                error_code             = 11;
  bool                  schema_validated       = 12;
  google.protobuf.Struct structured_output     = 13;
  string                content                = 14;
  repeated AttemptSummary attempts             = 15;
  string                route_version           = 16;
  string                price_table_version     = 17;
  string                release_id              = 18;
  string                response_schema_key     = 19;
  string                response_schema_version = 20;
  bool                  cache_hit               = 21;
  string                error_message           = 22;
  map<string, string>   error_metadata          = 23;
}

message ChatDelta {
  string content = 1;
  bool   done    = 2;
  ChatStreamEvent event = 3;
}
