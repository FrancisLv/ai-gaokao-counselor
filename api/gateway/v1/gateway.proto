syntax = "proto3";

package gateway.v1;

option go_package = "github.com/choucisan/ai-gaokao-counselor/api/gateway/v1;gatewayv1";

import "google/api/annotations.proto";
import "api/orchestrator/v1/orchestrator.proto";

// svc-gateway 对外 API。唯一对客户端暴露的服务。
// 流式输出（token / 节点事件）走 HTTP SSE，由 gateway 转推。
service Gateway {
  // 提交一次志愿规划请求（自然语言），返回 session，随后经 SSE 订阅事件。
  rpc CreatePlan(CreatePlanRequest) returns (CreatePlanReply) {
    option (google.api.http) = { post: "/v1/plans" body: "*" };
  }

  // 提交一次政策证据检索；不生成最终政策答案。
  rpc CreatePolicyQuery(CreatePolicyQueryRequest)
      returns (CreatePolicyQueryReply) {
    option (google.api.http) = {
      post: "/v1/policy-queries"
      body: "*"
    };
  }

  // 人工确认 / 修正画像（HITL 恢复点）。
  rpc ConfirmProfile(ConfirmProfileRequest) returns (ConfirmProfileReply) {
    option (google.api.http) = {
      post: "/v1/plans/{session_id}/profile:confirm"
      body: "*"
    };
  }

  // 补充"条件必需"信息（体检 / 单科 / 语种）后的恢复点。
  rpc BackfillProfile(BackfillProfileRequest) returns (BackfillProfileReply) {
    option (google.api.http) = {
      post: "/v1/plans/{session_id}/profile:backfill"
      body: "*"
    };
  }

  // 查询 run 的当前状态、中断和已完成预览。
  rpc GetRun(GetRunRequest) returns (orchestrator.v1.RunViewReply) {
    option (google.api.http) = {
      get: "/v1/runs/{run_id}"
    };
  }

  // 幂等取消 run；生命周期裁决仍由 orchestrator 完成。
  rpc CancelRun(CancelRunRequest) returns (orchestrator.v1.RunReceiptReply) {
    option (google.api.http) = {
      post: "/v1/runs/{run_id}:cancel"
      body: "*"
    };
  }

  // 从持久事件游标开始订阅 run 事件，HTTP 层按 SSE 输出。
  rpc WatchRun(WatchRunRequest) returns (stream orchestrator.v1.RunEvent) {
    option (google.api.http) = {
      get: "/v1/runs/{run_id}/events"
    };
  }
}

message CreatePlanRequest {
  string user_text = 1; // 用户自然语言描述
}

message CreatePlanReply {
  string session_id = 1;
  string status     = 2; // accepted | interrupted
  string run_id     = 3;
}

message CreatePolicyQueryRequest {
  string query_text = 1;
  string province = 2;
  int32 application_year = 3;
  string category = 4;
  string batch = 5;
  repeated string school_ids = 6;
  repeated string document_types = 7;
  string mode = 8;
  string session_id = 9;
  string idempotency_key = 10;
}

message CreatePolicyQueryReply {
  string session_id = 1;
  string status = 2;
  string run_id = 3;
}

message ConfirmProfileRequest {
  string session_id   = 1;
  string profile_json = 2; // 用户确认/修正后的画像
}

message ConfirmProfileReply {
  string session_id = 1;
  string status     = 2;
  string run_id     = 3;
}

message BackfillProfileRequest {
  string session_id  = 1;
  string backfill_json = 2; // 条件必需项的补充
}

message BackfillProfileReply {
  string session_id = 1;
  string status     = 2;
  string run_id     = 3;
}

message GetRunRequest {
  string run_id = 1;
}

message CancelRunRequest {
  string run_id = 1;
  string idempotency_key = 2;
}

message WatchRunRequest {
  string run_id = 1;
  int64 after_event_seq = 2;
}
