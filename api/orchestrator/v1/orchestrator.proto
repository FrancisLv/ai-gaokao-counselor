syntax = "proto3";

package orchestrator.v1;

option go_package = "github.com/choucisan/ai-gaokao-counselor/api/orchestrator/v1;orchestratorv1";

import "api/common/v1/common.proto";
import "api/algo/v1/algo.proto";
import "google/protobuf/timestamp.proto";

// svc-orchestrator（Python · LangGraph）实现；svc-gateway 调用它来驱动编排。
// 图的"节点 / 条件边 / 循环闸门 / 检查点"由 LangGraph 承载；gateway 只负责门控与推送。
service Orchestrator {
  // 启动图：从用户输入开始跑，事件以流返回（含 HITL 中断点）。
  rpc StartGraph(StartGraphRequest) returns (stream GraphEvent);

  // 恢复图：用户在中断点确认/补充后继续。
  rpc ResumeGraph(ResumeGraphRequest) returns (stream GraphEvent);

  // 持久受理任务；principal 来自可信 gRPC metadata，不在请求正文中。
  rpc SubmitRun(SubmitRunRequest) returns (RunReceiptReply);

  // 读取 run 当前状态；不推进图。
  rpc GetRun(GetRunRequest) returns (RunViewReply);

  // 回答或确认具体 interrupt；成功后持久转回 QUEUED，不等待图完成。
  rpc ResumeRun(ResumeRunRequest) returns (RunReceiptReply);

  // 从已持久化事件游标后补发并等待新事件；不推进图。
  rpc WatchRun(WatchRunRequest) returns (stream RunEvent);

  // 幂等取消 run。
  rpc CancelRun(CancelRunRequest) returns (RunReceiptReply);

  // 列出当前 principal 的对话；最新优先。
  rpc ListSessions(ListSessionsRequest) returns (ListSessionsReply);

  // 读取一条对话的完整消息、运行摘要与当前画像；必须校验 principal 所有权。
  rpc GetSession(GetSessionRequest) returns (ChatSessionReply);

  // 报告生成后继续对话：解释现有报告或按筛选条件创建修订 run。
  rpc SubmitConversationMessage(SubmitConversationMessageRequest)
      returns (SubmitConversationMessageReply);

  // 读取当前 principal 绑定某正式结果的最近一版志愿草稿。
  rpc GetWishlistDraft(GetWishlistDraftRequest) returns (WishlistDraftReply);

  // 显式保存用户拟填院校专业组及组内专业；创建新草稿版本，不修改正式结果。
  rpc SaveWishlistDraft(SaveWishlistDraftRequest)
      returns (WishlistDraftReply);

  // 列出当前 principal 已保存的志愿表；每份正式结果仅返回最新草稿。
  rpc ListWishlists(ListWishlistsRequest) returns (ListWishlistsReply);

  // 读取某正式结果下当前 principal 的全部草稿版本。
  rpc ListWishlistHistory(GetWishlistDraftRequest)
      returns (WishlistHistoryReply);

  // 把历史版本复制为新的最新版本。
  rpc RestoreWishlistDraftVersion(RestoreWishlistDraftVersionRequest)
      returns (WishlistDraftReply);

  // 删除当前 principal 的一份志愿表及全部草稿版本。
  rpc DeleteWishlist(DeleteWishlistRequest) returns (DeleteWishlistReply);

  // 内部入口：网关完成账号凭据校验后删除 principal 的全部私有资料。
  rpc DeletePrincipalData(DeletePrincipalDataRequest)
      returns (DeletePrincipalDataReply);

  // 撤销当前 principal 的敏感资格数据同意。
  rpc RevokeSensitiveConsent(RevokeSensitiveConsentRequest)
      returns (RevokeSensitiveConsentReply);
}

message StartGraphRequest {
  common.v1.Trace trace     = 1;
  string          user_text = 2;
}

message ResumeGraphRequest {
  common.v1.Trace trace          = 1;
  string          session_id     = 2;
  string          user_reply_json = 3; // 用户在中断点的回复（确认/修正/补充）
}

// 图事件：节点级进度 + 需要用户介入的提示 + 最终结果。
message GraphEvent {
  string node         = 1; // INIT / INTAKE / PROFILE_CONFIRM / RETRIEVING / CHECK_CONDITIONAL / ...
  string type         = 2; // progress | interrupt | result | error
  string payload_json = 3;
}

enum TaskKind {
  TASK_KIND_UNSPECIFIED = 0;
  GENERATE_PLAN = 1;
  POLICY_QA = 2;
  EXPLAIN_RESULT = 3;
  REVISE_PLAN = 4;
}

enum RunState {
  RUN_STATE_UNSPECIFIED = 0;
  QUEUED = 1;
  RUNNING = 2;
  WAITING_HITL = 3;
  EXPIRED = 4;
  SUCCEEDED = 5;
  FAILED = 6;
  CANCELLED = 7;
}

enum RunEventType {
  RUN_EVENT_TYPE_UNSPECIFIED = 0;
  STATE_CHANGED = 1;
  PROGRESS = 2;
  INTERRUPT = 3;
  RESULT = 4;
  ERROR = 5;
}

message StructuredProfileInput {
  string province = 1;
  int32 application_year = 2;
  string category = 3;
  string batch = 4;
  int32 score = 5;
  repeated string subjects = 6;
  string risk_appetite = 7;
  repeated string priority_dims = 8;
  repeated string interests = 9;
  repeated string preferred_cities = 10;
  repeated string preferred_tiers = 11;
  repeated string required_cities = 12;
  repeated string excluded_cities = 13;
  repeated string required_tiers = 14;
  repeated string required_major_keywords = 15;
  repeated string excluded_major_keywords = 16;
  repeated string excluded_universities = 17;
  repeated string excluded_major_names = 18;
  repeated string required_provinces = 19;
  repeated string excluded_provinces = 20;
  repeated string required_major_names = 21;
}

message PolicyQaInput {
  string query_text = 1;
  string province = 2;
  int32 application_year = 3;
  string category = 4;
  string batch = 5;
  repeated string school_ids = 6;
  repeated string document_types = 7;
  string mode = 8;
}

message SubmitRunRequest {
  common.v1.Trace trace = 1;
  string session_id = 2;
  TaskKind task_kind = 3;
  StructuredProfileInput profile_input = 4;
  string idempotency_key = 5;
  PolicyQaInput policy_input = 6;
  repeated ChatMessageInput messages = 7;
  string parent_result_version = 8;
  string user_message = 9;
}

message ChatMessageInput {
  string client_message_id = 1;
  string role = 2;
  string kind = 3;
  string content = 4;
}

message ChatMessageView {
  string message_id = 1;
  string run_id = 2;
  string role = 3;
  string kind = 4;
  string content = 5;
  google.protobuf.Timestamp created_at = 6;
  map<string, string> metadata = 7;
}

message RunReceiptReply {
  bool accepted = 1;
  string reason = 2;
  string run_id = 3;
  string session_id = 4;
  RunState state = 5;
  string stage = 6;
  int64 state_version = 7;
  int64 first_event_seq = 8;
  bool replayed = 9;
}

message GetRunRequest {
  common.v1.Trace trace = 1;
  string run_id = 2;
}

message WatchRunRequest {
  common.v1.Trace trace = 1;
  string run_id = 2;
  int64 after_event_seq = 3;
}

message StringList {
  repeated string values = 1;
}

message ProfileFieldView {
  string state = 1;
  string source = 2;

  oneof value {
    string string_value = 3;
    int32 int_value = 4;
    StringList string_list = 5;
  }
}

message ProfileFinding {
  string code = 1;
  repeated string field_keys = 2;
  bool blocking = 3;
  string message_key = 4;
}

message AnswerFields {
  map<string, ProfileFieldView> fields = 1;
}

message ConfirmProfileAnswer {}

message RejectOrEditProfileAnswer {
  map<string, ProfileFieldView> patch = 1;
}

message DeclineFieldsAnswer {
  repeated string field_keys = 1;
}

message RegionAnswer {
  string clarification_id = 1;
  repeated string provinces = 2;
  repeated string preset_ids = 3;
  string catalog_version = 4;
  bool cancel_region_restriction = 5;
}

message ResumeRunRequest {
  common.v1.Trace trace = 1;
  string run_id = 2;
  string interrupt_id = 3;
  int64 expected_state_version = 4;
  string profile_version = 5;
  string idempotency_key = 6;

  oneof answer {
    AnswerFields answer_fields = 7;
    ConfirmProfileAnswer confirm_profile = 8;
    RejectOrEditProfileAnswer reject_or_edit_profile = 9;
    DeclineFieldsAnswer decline_fields = 10;
    RegionAnswer region_answer = 11;
  }
}

message CancelRunRequest {
  common.v1.Trace trace = 1;
  string run_id = 2;
  string idempotency_key = 3;
}

message InterruptView {
  string interrupt_id = 1;
  string kind = 2;
  string state = 3;
  string question_key = 4;
  int32 payload_version = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp expires_at = 7;
  string profile_version = 8;
  map<string, ProfileFieldView> fields = 9;
  repeated ProfileFinding findings = 10;
  RegionClarificationView region_clarification = 11;
}

message RegionPreset {
  string id = 1;
  string name = 2;
  repeated string provinces = 3;
}

message RegionClarificationView {
  string clarification_id = 1;
  string clarification_kind = 2;
  string reason_code = 3;
  string term = 4;
  string operation = 5;
  string catalog_version = 6;
  repeated string provinces = 7;
  repeated RegionPreset presets = 8;
}

message ResultReference {
  string result_version = 1;
  string result_kind = 2;
}

message AlgorithmVerificationCheck {
  string key = 1;
  string status = 2;
  string detail = 3;
}

message UnverifiedCondition {
  string code = 1;
  string message = 2;
}

message EligibilityGate {
  bool formal_eligibility_ready = 1;
  repeated string eligible_group_keys = 2;
  repeated string restricted_group_keys = 3;
  repeated string unknown_group_keys = 4;
  repeated string failed_group_keys = 5;
}

message AlgorithmPreview {
  string result_version = 1;
  string run_id = 2;
  string release_id = 3;
  string confirmed_profile_version = 4;
  int32 rank = 5;
  double percentile = 6;
  repeated algo.v1.CandidateWithProb rush_candidates = 7;
  repeated algo.v1.CandidateWithProb stable_candidates = 8;
  repeated algo.v1.CandidateWithProb safe_candidates = 9;
  int32 rush_total = 10;
  int32 stable_total = 11;
  int32 safe_total = 12;
  algo.v1.AuditBasis audit_basis = 13;
  repeated algo.v1.CandidateWithProb kept_candidates = 14;
  repeated algo.v1.RejectedCandidate rejected_candidates = 15;
  algo.v1.WishlistResult wishlist = 16;
  string algorithm_method = 17;
  string algorithm_config_version = 18;
  repeated AlgorithmVerificationCheck verification_summary = 19;
  repeated UnverifiedCondition unverified_conditions = 20;
  string risk_notice = 21;
  string disclaimer = 22;
  bool formal_recommendation = 23;
  string result_kind = 24;
  bool internal_controlled_only = 25;
  algo.v1.EvaluateEligibilityReply eligibility = 26;
  EligibilityGate eligibility_gate = 27;
}

message PolicyEvidenceItem {
  string evidence_id = 1;
  string doc_id = 2;
  string chunk_id = 3;
  string title = 4;
  string document_type = 5;
  string issuer = 6;
  string source_uri = 7;
  google.protobuf.Timestamp fetched_at = 8;
  string section_path = 9;
  string excerpt = 10;
  string excerpt_sha256 = 11;
  optional int32 char_start = 12;
  optional int32 char_end = 13;
  repeated string regions = 14;
  repeated string categories = 15;
  repeated string batches = 16;
  string valid_from = 17;
  string valid_to = 18;
  string release_id = 19;
  string evidence_type = 20;
  string content_sha256 = 21;
  google.protobuf.Timestamp created_at = 22;
  string producer_version = 23;
}

message PolicyEvidenceResult {
  string result_version = 1;
  string result_kind = 2;
  string run_id = 3;
  string release_id = 4;
  string retrieval_status = 5;
  string degraded_reason = 6;
  int32 vector_candidates = 7;
  int32 keyword_candidates = 8;
  bool rerank_enabled = 9;
  string rerank_model = 10;
  string rerank_config_version = 11;
  repeated PolicyEvidenceItem evidence = 12;
  int32 rerank_timeout_ms = 13;
  int32 relevance_filtered_candidates = 14;
  string relevance_policy_version = 15;
}

message FormalClaimVerification {
  string claim_id = 1;
  string criticality = 2;
  string status = 3;
  string reason = 4;
  repeated string checked_against = 5;
  bool deterministic = 6;
  string claim_type = 7;
}

message FormalResultSummary {
  string result_version = 1;
  string result_kind = 2;
  string release_id = 3;
  string confirmed_profile_version = 4;
  string evidence_package_sha256 = 5;
  string verification_report_sha256 = 6;
  string verification_status = 7;
  repeated FormalClaimVerification claims = 8;
  repeated string blocking_reasons = 9;
  repeated string stripped_claim_ids = 10;
  double citation_coverage = 11;
  string result_state = 12;
  string stale_reason = 13;
  string disclaimer = 14;
  string risk_notice = 15;
  string no_admission_guarantee = 16;
  FormalReport report = 17;
}

message HistoricalAdmissionReference {
  int32 year = 1;
  optional int32 min_score = 2;
  optional int32 min_rank = 3;
  optional int32 total_count = 4;
  string mapping_method = 5;
  double mapping_confidence = 6;
}

message ReportMajor {
  string major_code = 1;
  string major_name = 2;
  string subject_req = 3;
  optional int32 min_score = 4;
  optional int32 min_rank = 5;
  optional int32 reference_year = 6;
  optional double admission_probability = 7;
  int32 probability_data_years = 8;
  optional int32 plan_count = 9;
  optional double tuition = 10;
  string duration = 11;
  bool recommended = 12;
  int32 recommendation_rank = 13;
  bool selectable = 14;
  string unavailable_reason = 15;
  repeated int32 probability_sample_years = 16;
}

message FormalReportSection {
  string section_key = 1;
  string title = 2;
  string body = 3;
  repeated FormalEvidenceCitation citations = 4;
  repeated HistoricalAdmissionReference history = 5;
  repeated ReportMajor majors = 6;
  optional int32 plan_count = 7;
  optional double probability = 8;
  string strategy_tier = 9;
  int32 final_rank = 10;
  string university_code = 11;
  string university_name = 12;
  string major_group = 13;
  optional int32 previous_plan_count = 14;
  optional double plan_adjust_factor = 15; // Deprecated：兼容保留
  optional double utility_score = 16; // 草稿风险摘要的期望满意度输入；不直接作为用户主文案
}

message FormalEvidenceCitation {
  string evidence_id = 1;
  string evidence_type = 2;
  string content_sha256 = 3;
  string label = 4;
  string source_uri = 5;
  string section_path = 6;
  string release_id = 7;
}

message FormalReport {
  string report_version = 1;
  string generation_mode = 2;
  repeated FormalReportSection sections = 3;
  repeated string claim_ids = 4;
  repeated string unverified_facts = 5;
  string degradation_reason = 6;
}

message RunViewReply {
  string run_id = 1;
  string session_id = 2;
  TaskKind task_kind = 3;
  RunState state = 4;
  string stage = 5;
  string terminal_reason = 6;
  int64 state_version = 7;
  string release_id = 8;
  string confirmed_profile_version = 9;
  google.protobuf.Timestamp cancel_requested_at = 10;
  InterruptView current_interrupt = 11;
  ResultReference result = 12;
  google.protobuf.Timestamp created_at = 13;
  google.protobuf.Timestamp updated_at = 14;
  int64 active_execution_remaining_ms = 15;
  AlgorithmPreview result_preview = 16;
  google.protobuf.Timestamp expires_at = 17;
  PolicyEvidenceResult policy_evidence = 18;
  FormalResultSummary formal_result = 19;
  string parent_result_version = 20;
  string conversation_answer = 21;
}

message SessionRunView {
  string run_id = 1;
  TaskKind task_kind = 2;
  RunState state = 3;
  string stage = 4;
  string terminal_reason = 5;
  string parent_result_version = 6;
  string result_version = 7;
  string result_kind = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
}

message ChatSessionSummary {
  string session_id = 1;
  string title = 2;
  string latest_run_id = 3;
  string latest_state = 4;
  string latest_result_version = 5;
  string latest_result_kind = 6;
  int32 run_count = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
}

message ChatSessionReply {
  ChatSessionSummary summary = 1;
  repeated ChatMessageView messages = 2;
  repeated SessionRunView runs = 3;
  map<string, ProfileFieldView> profile_fields = 4;
}

message ListSessionsRequest {
  common.v1.Trace trace = 1;
  int32 limit = 2;
}

message ListSessionsReply {
  repeated ChatSessionSummary sessions = 1;
}

message GetSessionRequest {
  common.v1.Trace trace = 1;
  string session_id = 2;
}

message SubmitConversationMessageRequest {
  common.v1.Trace trace = 1;
  string session_id = 2;
  StructuredProfileInput profile_input = 3;
  string parent_result_version = 4;
  string message_text = 5;
  string idempotency_key = 6;
  RegionAnswer region_answer = 7;
}

message SubmitConversationMessageReply {
  string session_id = 1;
  string run_id = 2;
  string task_kind = 3;
  string status = 4;
  string assistant_message = 5;
  RegionClarificationView region_clarification = 6;
}

message WishlistDraftGroup {
  string university_code = 1;
  string major_group = 2;
  repeated string major_codes = 3; // 拟填顺序；每组 1..6，且不得重复
}

message GetWishlistDraftRequest {
  common.v1.Trace trace = 1;
  string result_version = 2;
}

message SaveWishlistDraftRequest {
  common.v1.Trace trace = 1;
  string result_version = 2;
  int64 expected_version = 3; // 0 表示首次创建
  string idempotency_key = 4;
  repeated WishlistDraftGroup groups = 5; // 用户顺序；正式报告的 1..45 个组子集
}

message WishlistDraftRisk {
  int32 group_count = 1;
  int32 rush_count = 2;
  int32 stable_count = 3;
  int32 safe_tier_count = 4;
  int32 safe_guard_count = 5;
  int32 safe_guard_target = 6;
  bool safe_guard_ok = 7;
  double slip_rate = 8;
  optional double expected_satisfaction = 9;
}

message WishlistDraft {
  string draft_version_id = 1;
  string result_version = 2;
  string run_id = 3;
  string release_id = 4;
  int64 draft_version = 5;
  repeated WishlistDraftGroup groups = 6;
  google.protobuf.Timestamp created_at = 7;
  optional WishlistDraftRisk risk = 8;
}

message WishlistDraftReply {
  optional WishlistDraft draft = 1;
}

message ListWishlistsRequest {
  common.v1.Trace trace = 1;
  int32 limit = 2;
  int32 offset = 3;
  string status = 4;
}

message WishlistSummary {
  string draft_version_id = 1;
  string result_version = 2;
  string run_id = 3;
  string release_id = 4;
  int64 draft_version = 5;
  string title = 6;
  int32 application_year = 7;
  string category = 8;
  string batch = 9;
  int32 group_count = 10;
  int32 major_count = 11;
  string status = 12;
  string stale_reason = 13;
  string successor_run_id = 14;
  google.protobuf.Timestamp saved_at = 15;
}

message ListWishlistsReply {
  repeated WishlistSummary wishlists = 1;
}

message WishlistHistoryReply {
  repeated WishlistDraft drafts = 1;
}

message RestoreWishlistDraftVersionRequest {
  common.v1.Trace trace = 1;
  string result_version = 2;
  int64 draft_version = 3;
  string idempotency_key = 4;
}

message DeleteWishlistRequest {
  common.v1.Trace trace = 1;
  string result_version = 2;
  string request_id = 3;
}

message DeleteWishlistReply {
  bool deleted = 1;
  string request_id = 2;
}

message DeletePrincipalDataRequest {
  common.v1.Trace trace = 1;
  string request_id = 2;
}

message DeletePrincipalDataReply {
  bool accepted = 1;
  string status = 2;
  string reason = 3;
}

message RevokeSensitiveConsentRequest {
  common.v1.Trace trace = 1;
}

message RevokeSensitiveConsentReply {
  int32 revoked_count = 1;
}

message StateChangedPayload {
  string from_state = 1;
  string to_state = 2;
}

message ProgressPayload {
  string stage = 1;
  string message = 2;
  map<string, string> metadata = 3;
}

message ErrorPayload {
  string code = 1;
  string message = 2;
  bool retryable = 3;
}

message RunEvent {
  string run_id = 1;
  int64 event_seq = 2;
  RunEventType type = 3;
  string stage = 4;
  int64 state_version = 5;
  google.protobuf.Timestamp occurred_at = 6;
  int32 payload_version = 7;

  oneof payload {
    StateChangedPayload state_changed = 8;
    InterruptView interrupt = 9;
    ProgressPayload progress = 10;
    ErrorPayload error = 11;
    AlgorithmPreview result = 12;
    PolicyEvidenceResult policy_evidence = 13;
    FormalResultSummary formal_result = 14;
  }
}
