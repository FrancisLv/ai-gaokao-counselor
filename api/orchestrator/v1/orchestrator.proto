syntax = "proto3";

package orchestrator.v1;

option go_package = "github.com/choucisan/ai-gaokao-counselor/api/orchestrator/v1;orchestratorv1";

import "api/common/v1/common.proto";
import "api/algo/v1/algo.proto";
import "google/protobuf/timestamp.proto";

// svc-orchestrator（Python · LangGraph）实现；svc-gateway 调用它来驱动编排。
// 图的"节点 / 条件边 / 循环闸门 / 检查点"由 LangGraph 承载；gateway 只负责门控与推送。
service Orchestrator {
  // 启动图：从用户输入开始跑，事件以流返回（含 HITL 中断点）。
  rpc StartGraph(StartGraphRequest) returns (stream GraphEvent);

  // 恢复图：用户在中断点确认/补充后继续。
  rpc ResumeGraph(ResumeGraphRequest) returns (stream GraphEvent);

  // 持久受理任务；principal 来自可信 gRPC metadata，不在请求正文中。
  rpc SubmitRun(SubmitRunRequest) returns (RunReceiptReply);

  // 读取 run 当前状态；不推进图。
  rpc GetRun(GetRunRequest) returns (RunViewReply);

  // 回答或确认具体 interrupt；成功后持久转回 QUEUED，不等待图完成。
  rpc ResumeRun(ResumeRunRequest) returns (RunReceiptReply);

  // 从已持久化事件游标后补发并等待新事件；不推进图。
  rpc WatchRun(WatchRunRequest) returns (stream RunEvent);

  // 幂等取消 run。
  rpc CancelRun(CancelRunRequest) returns (RunReceiptReply);
}

message StartGraphRequest {
  common.v1.Trace trace     = 1;
  string          user_text = 2;
}

message ResumeGraphRequest {
  common.v1.Trace trace          = 1;
  string          session_id     = 2;
  string          user_reply_json = 3; // 用户在中断点的回复（确认/修正/补充）
}

// 图事件：节点级进度 + 需要用户介入的提示 + 最终结果。
message GraphEvent {
  string node         = 1; // INIT / INTAKE / PROFILE_CONFIRM / RETRIEVING / CHECK_CONDITIONAL / ...
  string type         = 2; // progress | interrupt | result | error
  string payload_json = 3;
}

enum TaskKind {
  TASK_KIND_UNSPECIFIED = 0;
  GENERATE_PLAN = 1;
  POLICY_QA = 2;
  EXPLAIN_RESULT = 3;
  REVISE_PLAN = 4;
}

enum RunState {
  RUN_STATE_UNSPECIFIED = 0;
  QUEUED = 1;
  RUNNING = 2;
  WAITING_HITL = 3;
  EXPIRED = 4;
  SUCCEEDED = 5;
  FAILED = 6;
  CANCELLED = 7;
}

enum RunEventType {
  RUN_EVENT_TYPE_UNSPECIFIED = 0;
  STATE_CHANGED = 1;
  PROGRESS = 2;
  INTERRUPT = 3;
  RESULT = 4;
  ERROR = 5;
}

message StructuredProfileInput {
  string province = 1;
  int32 application_year = 2;
  string category = 3;
  string batch = 4;
  int32 score = 5;
  repeated string subjects = 6;
}

message PolicyQaInput {
  string query_text = 1;
  string province = 2;
  int32 application_year = 3;
  string category = 4;
  string batch = 5;
  repeated string school_ids = 6;
  repeated string document_types = 7;
  string mode = 8;
}

message SubmitRunRequest {
  common.v1.Trace trace = 1;
  string session_id = 2;
  TaskKind task_kind = 3;
  StructuredProfileInput profile_input = 4;
  string idempotency_key = 5;
  PolicyQaInput policy_input = 6;
}

message RunReceiptReply {
  bool accepted = 1;
  string reason = 2;
  string run_id = 3;
  string session_id = 4;
  RunState state = 5;
  string stage = 6;
  int64 state_version = 7;
  int64 first_event_seq = 8;
  bool replayed = 9;
}

message GetRunRequest {
  common.v1.Trace trace = 1;
  string run_id = 2;
}

message WatchRunRequest {
  common.v1.Trace trace = 1;
  string run_id = 2;
  int64 after_event_seq = 3;
}

message StringList {
  repeated string values = 1;
}

message ProfileFieldView {
  string state = 1;
  string source = 2;

  oneof value {
    string string_value = 3;
    int32 int_value = 4;
    StringList string_list = 5;
  }
}

message ProfileFinding {
  string code = 1;
  repeated string field_keys = 2;
  bool blocking = 3;
  string message_key = 4;
}

message AnswerFields {
  map<string, ProfileFieldView> fields = 1;
}

message ConfirmProfileAnswer {}

message RejectOrEditProfileAnswer {
  map<string, ProfileFieldView> patch = 1;
}

message DeclineFieldsAnswer {
  repeated string field_keys = 1;
}

message ResumeRunRequest {
  common.v1.Trace trace = 1;
  string run_id = 2;
  string interrupt_id = 3;
  int64 expected_state_version = 4;
  string profile_version = 5;
  string idempotency_key = 6;

  oneof answer {
    AnswerFields answer_fields = 7;
    ConfirmProfileAnswer confirm_profile = 8;
    RejectOrEditProfileAnswer reject_or_edit_profile = 9;
    DeclineFieldsAnswer decline_fields = 10;
  }
}

message CancelRunRequest {
  common.v1.Trace trace = 1;
  string run_id = 2;
  string idempotency_key = 3;
}

message InterruptView {
  string interrupt_id = 1;
  string kind = 2;
  string state = 3;
  string question_key = 4;
  int32 payload_version = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp expires_at = 7;
  string profile_version = 8;
  map<string, ProfileFieldView> fields = 9;
  repeated ProfileFinding findings = 10;
}

message ResultReference {
  string result_version = 1;
  string result_kind = 2;
}

message AlgorithmVerificationCheck {
  string key = 1;
  string status = 2;
  string detail = 3;
}

message UnverifiedCondition {
  string code = 1;
  string message = 2;
}

message AlgorithmPreview {
  string result_version = 1;
  string run_id = 2;
  string release_id = 3;
  string confirmed_profile_version = 4;
  int32 rank = 5;
  double percentile = 6;
  repeated algo.v1.CandidateWithProb rush_candidates = 7;
  repeated algo.v1.CandidateWithProb stable_candidates = 8;
  repeated algo.v1.CandidateWithProb safe_candidates = 9;
  int32 rush_total = 10;
  int32 stable_total = 11;
  int32 safe_total = 12;
  algo.v1.AuditBasis audit_basis = 13;
  repeated algo.v1.CandidateWithProb kept_candidates = 14;
  repeated algo.v1.RejectedCandidate rejected_candidates = 15;
  algo.v1.WishlistResult wishlist = 16;
  string algorithm_method = 17;
  string algorithm_config_version = 18;
  repeated AlgorithmVerificationCheck verification_summary = 19;
  repeated UnverifiedCondition unverified_conditions = 20;
  string risk_notice = 21;
  string disclaimer = 22;
  bool formal_recommendation = 23;
  string result_kind = 24;
  bool internal_controlled_only = 25;
}

message PolicyEvidenceItem {
  string evidence_id = 1;
  string doc_id = 2;
  string chunk_id = 3;
  string title = 4;
  string document_type = 5;
  string issuer = 6;
  string source_uri = 7;
  google.protobuf.Timestamp fetched_at = 8;
  string section_path = 9;
  string excerpt = 10;
  string excerpt_sha256 = 11;
  optional int32 char_start = 12;
  optional int32 char_end = 13;
  repeated string regions = 14;
  repeated string categories = 15;
  repeated string batches = 16;
  string valid_from = 17;
  string valid_to = 18;
  string release_id = 19;
}

message PolicyEvidenceResult {
  string result_version = 1;
  string result_kind = 2;
  string run_id = 3;
  string release_id = 4;
  string retrieval_status = 5;
  string degraded_reason = 6;
  int32 vector_candidates = 7;
  int32 keyword_candidates = 8;
  bool rerank_enabled = 9;
  string rerank_model = 10;
  string rerank_config_version = 11;
  repeated PolicyEvidenceItem evidence = 12;
}

message RunViewReply {
  string run_id = 1;
  string session_id = 2;
  TaskKind task_kind = 3;
  RunState state = 4;
  string stage = 5;
  string terminal_reason = 6;
  int64 state_version = 7;
  string release_id = 8;
  string confirmed_profile_version = 9;
  google.protobuf.Timestamp cancel_requested_at = 10;
  InterruptView current_interrupt = 11;
  ResultReference result = 12;
  google.protobuf.Timestamp created_at = 13;
  google.protobuf.Timestamp updated_at = 14;
  int64 active_execution_remaining_ms = 15;
  AlgorithmPreview result_preview = 16;
  google.protobuf.Timestamp expires_at = 17;
  PolicyEvidenceResult policy_evidence = 18;
}

message StateChangedPayload {
  string from_state = 1;
  string to_state = 2;
}

message ProgressPayload {
  string stage = 1;
  string message = 2;
  map<string, string> metadata = 3;
}

message ErrorPayload {
  string code = 1;
  string message = 2;
  bool retryable = 3;
}

message RunEvent {
  string run_id = 1;
  int64 event_seq = 2;
  RunEventType type = 3;
  string stage = 4;
  int64 state_version = 5;
  google.protobuf.Timestamp occurred_at = 6;
  int32 payload_version = 7;

  oneof payload {
    StateChangedPayload state_changed = 8;
    InterruptView interrupt = 9;
    ProgressPayload progress = 10;
    ErrorPayload error = 11;
    AlgorithmPreview result = 12;
    PolicyEvidenceResult policy_evidence = 13;
  }
}
