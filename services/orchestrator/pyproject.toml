[project]
name = "ai-gaokao-counselor-orchestrator"
version = "0.0.1"
description = "svc-orchestrator：LangGraph 编排 + 检索 + 本地推理"
requires-python = ">=3.11"
dependencies = [
  "grpcio>=1.84",
  "grpcio-tools==1.84.0",
  "protobuf>=7.35.1,<8",
  "googleapis-common-protos>=1.72",
  "langgraph>=0.2",
  "langchain-core>=0.3",
  "sentence-transformers>=3.0",
  "psycopg[binary]>=3.1",
  "pgvector>=0.2",
  "redis>=5.0",
  "httpx>=0.27",
  "tqdm>=4.66",
  "numpy>=1.26",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {api = "pb/api"}

[tool.setuptools.packages.find]
where = [".", "pb"]
include = ["app*", "graph*", "rag*", "eval*", "api*"]
namespaces = true
