[project]
name = "ai-gaokao-counselor-orchestrator"
version = "0.0.1"
description = "svc-orchestrator：LangGraph 编排 + 检索 + 本地推理"
requires-python = ">=3.11"
dependencies = [
  "grpcio>=1.63",
  "grpcio-tools>=1.63",
  "protobuf>=4.25",
  "langgraph>=0.2",
  "langchain-core>=0.3",
  "sentence-transformers>=3.0",
  "psycopg[binary]>=3.1",
  "pgvector>=0.2",
  "redis>=5.0",
  "httpx>=0.27",
]

[tool.setuptools]
packages = ["app", "graph", "graph.nodes", "rag", "eval", "pb"]
