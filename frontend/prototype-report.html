<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>知愿 · 静态推荐报告原型</title>
    <link rel="stylesheet" href="/prototype.css" />
  </head>
  <body>
    <div id="app"></div>
    <script>
      // THROWAWAY PROTOTYPE — answers: how should the static report be structured?
      const params = new URLSearchParams(location.search);
      const variants = ["A", "B", "C"];
      const variantNames = {
        A: "阅读型文章",
        B: "筛选型仪表台",
        C: "杂志式展示",
      };
      const state = {
        variant: variants.includes(params.get("variant"))
          ? params.get("variant")
          : "A",
      };
      const schools = [
        ["csu", "冲", "中南大学", "专业组 03", "计算机类、软件工程、电子信息类", "34%", "长沙", "教育部直属 · 双一流"],
        ["hnu", "冲", "湖南大学", "专业组 07", "电子信息工程、计算机科学与技术", "38%", "长沙", "教育部直属 · 双一流"],
        ["hunnu", "稳", "湖南师范大学", "专业组 12", "计算机科学与技术、人工智能", "57%", "长沙", "省属重点 · 双一流"],
        ["xtu", "稳", "湘潭大学", "专业组 06", "软件工程、网络空间安全", "61%", "湘潭", "省属重点 · 双一流"],
        ["csust", "稳", "长沙理工大学", "专业组 05", "自动化、电子信息工程", "65%", "长沙", "省属重点"],
        ["csuft", "稳", "中南林业科技大学", "专业组 09", "计算机科学与技术、电子信息工程", "69%", "长沙", "省属重点"],
        ["hunau", "保", "湖南农业大学", "专业组 04", "人工智能、信息工程", "76%", "长沙", "省属重点"],
        ["usc", "保", "南华大学", "专业组 08", "软件工程、电气工程及其自动化", "80%", "衡阳", "省属重点"],
        ["hnust", "保", "湖南科技大学", "专业组 11", "计算机科学与技术、通信工程", "82%", "湘潭", "省属重点"],
        ["hutb", "保", "湖南工商大学", "专业组 03", "信息管理与信息系统、电子商务", "85%", "长沙", "省属本科"],
        ["hnu_e", "保", "湖南工程学院", "专业组 06", "自动化、电子信息工程", "88%", "湘潭", "省属本科"],
        ["hnist", "保", "湖南理工学院", "专业组 02", "计算机科学与技术、机械电子工程", "90%", "岳阳", "省属本科"],
      ];

      function updateVariant(variant) {
        const next = new URLSearchParams(location.search);
        next.set("variant", variant);
        history.replaceState({}, "", `${location.pathname}?${next}`);
        state.variant = variant;
        render();
      }

      function switcher() {
        return `
          <div class="prototype-badge">
            <b>静态 HTML 报告原型</b>
            <span>演示数据 · 非正式推荐 · 可点击学校进入详情页</span>
          </div>
          <div class="prototype-switcher">
            <button data-variant-step="-1" aria-label="上一个方案">←</button>
            <span>${state.variant} · ${variantNames[state.variant]}</span>
            <button data-variant-step="1" aria-label="下一个方案">→</button>
          </div>
        `;
      }

      function schoolUrl(id) {
        return `prototype-school.html?variant=${state.variant}&school=${id}`;
      }

      function topbar() {
        return `
          <header class="report-topbar">
            <a class="back-link" href="prototype-chat.html?variant=${state.variant}&step=result">← 返回对话</a>
            <strong>知愿 · 志愿推荐报告</strong>
            <span class="muted">RESULT 2025-07-18-001</span>
          </header>
        `;
      }

      function tierClass(tier) {
        return tier === "稳" ? "stable" : tier === "保" ? "safe" : "";
      }

      function schoolRowA([id, tier, name, group, majors, probability, city, tierText]) {
        return `
          <a class="school-row" href="${schoolUrl(id)}">
            <span class="tier ${tierClass(tier)}">${tier}</span>
            <div>
              <h3>${name} · ${group}</h3>
              <p>${majors} · ${city} · ${tierText}</p>
            </div>
            <div>
              <span class="muted">历史估算</span>
              <div class="probability">${probability}</div>
            </div>
          </a>
        `;
      }

      function schoolCardB([id, tier, name, group, majors, probability, city, tierText]) {
        return `
          <article class="school-card-b">
            <span class="tier ${tierClass(tier)}">${tier}</span>
            <h2>${name}</h2>
            <p>${group} · ${majors}<br />${city} · ${tierText}</p>
            <div class="metric-pair">
              <div><span class="muted">历史估算概率</span><strong>${probability}</strong></div>
              <a href="${schoolUrl(id)}">查看详情 →</a>
            </div>
          </article>
        `;
      }

      function schoolCardC([id, tier, name, group, majors, probability, city]) {
        return `
          <article class="magazine-card">
            <div class="magazine-cover ${tierClass(tier)}">
              <span class="tier ${tierClass(tier)}">${tier}</span>
              <div style="margin-top: 19px; font-size: 12px">${city} · 湖南 2025</div>
            </div>
            <div class="magazine-body">
              <h3>${name}</h3>
              <p>${group} · ${majors}</p>
              <div class="magazine-foot">
                <strong>${probability}</strong>
                <a href="${schoolUrl(id)}">阅读详情 →</a>
              </div>
            </div>
          </article>
        `;
      }

      function reportA() {
        return `
          ${topbar()}
          <div class="report-a-grid">
            <nav class="toc">
              <span class="muted">目录</span>
              <a class="active" href="#summary">方案概览</a>
              <a href="#rush">冲刺院校</a>
              <a href="#stable">稳妥院校</a>
              <a href="#safe">保底院校</a>
              <a href="#evidence">数据与风险</a>
            </nav>
            <article class="article-report">
              <span class="report-kicker">PERSONAL PLAN · 湖南物理类</span>
              <h1>612 分，怎样把志愿梯度排得更稳？</h1>
              <p class="lede">
                基于湖南 2025 本科批公开招生数据，你的方案按“冲、稳、保”三档组织。以下学校按算法生成的最终顺序排列，概率仅作历史估算。
              </p>
              <div id="summary" class="report-summary">
                <div class="summary-tile"><small>高考分数</small><strong>612</strong></div>
                <div class="summary-tile"><small>选科组合</small><strong>物化生</strong></div>
                <div class="summary-tile"><small>预估位次</small><strong>8,640</strong></div>
                <div class="summary-tile"><small>推荐学校</small><strong>12 所</strong></div>
              </div>
              <section id="rush" class="report-section">
                <h2>冲刺：值得尝试，但要留好后手</h2>
                <p>冲刺院校更适合放在志愿表前段。下表中的概率来自历史录取位次和样本年份估算，不代表当年录取结果。</p>
                <div class="school-list">${schools.filter(([, t]) => t === "冲").map(schoolRowA).join("")}</div>
              </section>
              <section id="stable" class="report-section">
                <h2>稳妥：与你当前位次更接近</h2>
                <p>稳妥院校通常应成为志愿表主体，并进一步核对专业组内的专业限制。</p>
                <div class="school-list">${schools.filter(([, t]) => t === "稳").map(schoolRowA).join("")}</div>
              </section>
              <section id="safe" class="report-section">
                <h2>保底：确保方案有可接受的落点</h2>
                <p>保底不等于保证录取。请结合专业接受度、城市偏好和家庭预算逐项确认。</p>
                <div class="school-list">${schools.filter(([, t]) => t === "保").map(schoolRowA).join("")}</div>
              </section>
              <section id="evidence" class="report-section">
                <h2>数据依据与风险提示</h2>
                <p>本报告使用湖南 2025 新高考本科批数据。每所学校详情页提供专业组、样本年份、概率口径与原文来源。</p>
                <div class="risk-note">录取概率是历史数据的近似估算，存在滑档风险。系统不保证录取，也不替代考试院发布的正式招生计划。</div>
              </section>
            </article>
            <aside class="report-aside">
              <section class="panel-card">
                <h3>画像确认</h3>
                <p>湖南 · 2025 · 物理类<br />本科批 · 612 分<br />物化生 · 长沙优先</p>
              </section>
              <section class="panel-card">
                <h3>已核验</h3>
                <p>✓ 选科组合<br />✓ 专业组身份<br />✓ 关键招生限制<br />✓ 数据版本</p>
              </section>
              <section class="panel-card">
                <h3>报告状态</h3>
                <p>已通过事实校验<br />2025-07-18 生成</p>
              </section>
            </aside>
          </div>
        `;
      }

      function reportB() {
        return `
          ${topbar()}
          <div class="report-b-layout">
            <aside class="report-b-filter">
              <h2>筛选推荐</h2>
              <div class="filter-group">
                <h3>梯度</h3>
                <div class="filter-option active"><span>全部</span><span>12</span></div>
                <div class="filter-option"><span>冲</span><span>2</span></div>
                <div class="filter-option"><span>稳</span><span>4</span></div>
                <div class="filter-option"><span>保</span><span>6</span></div>
              </div>
              <div class="filter-group">
                <h3>城市</h3>
                <div class="filter-option active"><span>全部城市</span></div>
                <div class="filter-option"><span>长沙</span><span>7</span></div>
                <div class="filter-option"><span>湘潭</span><span>2</span></div>
              </div>
              <div class="filter-group">
                <h3>专业方向</h3>
                <div class="filter-option active"><span>计算机 / 电子信息</span></div>
              </div>
            </aside>
            <main class="report-b-main">
              <div class="report-b-head">
                <div>
                  <h1>你的推荐学校</h1>
                  <p>湖南 2025 · 物理类 · 612 分 · 12 所</p>
                </div>
                <span class="choice-chip primary">冲稳保均衡</span>
              </div>
              <div class="report-b-grid">${schools.map(schoolCardB).join("")}</div>
              <div class="risk-note" style="margin-top: 24px">
                以上概率均为历史数据估算，不是录取承诺。正式填报前请以湖南省教育考试院和学校当年招生章程为准。
              </div>
            </main>
          </div>
        `;
      }

      function reportC() {
        return `
          ${topbar()}
          <main>
            <section class="report-c-hero">
              <span class="report-kicker">YOUR 2025 SHORTLIST</span>
              <h1>一份更适合你的<br />湖南本科志愿清单。</h1>
              <p>从 612 分出发，结合物化生选科、长沙区域偏好与计算机/电子信息方向，整理出 12 所值得进一步了解的学校。</p>
              <div class="hero-stats">
                <div><strong>612</strong><small>高考分数</small></div>
                <div><strong>8,640</strong><small>预估位次</small></div>
                <div><strong>12</strong><small>推荐学校</small></div>
                <div><strong>4</strong><small>优先城市</small></div>
              </div>
            </section>
            <div class="report-c-body">
              <div class="tier-strip">
                <div class="tier-summary"><span class="tier">冲</span><strong>2 所学校</strong><p class="muted">向上尝试，注意专业组限制</p></div>
                <div class="tier-summary"><span class="tier stable">稳</span><strong>4 所学校</strong><p class="muted">匹配当前位次，重点关注</p></div>
                <div class="tier-summary"><span class="tier safe">保</span><strong>6 所学校</strong><p class="muted">给方案留下安全余量</p></div>
              </div>
              <div class="magazine-grid">${schools.map(schoolCardC).join("")}</div>
              <div class="risk-note" style="margin-top: 26px">
                本页为静态报告原型，使用演示数据。正式版本会绑定 result_version、招生年份和原文证据链接；不构成录取承诺。
              </div>
            </div>
          </main>
        `;
      }

      function render() {
        const content =
          state.variant === "A"
            ? reportA()
            : state.variant === "B"
              ? reportB()
              : reportC();
        document.querySelector("#app").innerHTML = `<div class="report-page">${content}</div>${switcher()}`;
      }

      document.addEventListener("click", (event) => {
        const button = event.target.closest("[data-variant-step]");
        if (!button) return;
        const current = variants.indexOf(state.variant);
        const direction = Number(button.dataset.variantStep);
        updateVariant(variants[(current + direction + variants.length) % variants.length]);
      });

      document.addEventListener("keydown", (event) => {
        if (event.target instanceof HTMLInputElement || event.target instanceof HTMLTextAreaElement) return;
        if (event.key !== "ArrowLeft" && event.key !== "ArrowRight") return;
        const current = variants.indexOf(state.variant);
        const direction = event.key === "ArrowRight" ? 1 : -1;
        updateVariant(variants[(current + direction + variants.length) % variants.length]);
      });

      render();
    </script>
  </body>
</html>
