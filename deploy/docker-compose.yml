name: ai-gaokao-counselor

services:
  gateway:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.go
      args: { SERVICE: gateway }
    ports: ["8000:8000"]
    depends_on: [orchestrator]

  llm-gateway:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.go
      args: { SERVICE: llm-gateway }
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:?set OPENAI_API_KEY in .env}
    depends_on: [redis]

  algo:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.go
      args: { SERVICE: algo }
    depends_on: [postgres]

  orchestrator:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.python
    ports: ["9100:9100"]
    depends_on: [postgres, redis]

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: gaokao
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../migrations:/docker-entrypoint-initdb.d:ro

  redis:
    image: redis:7
    ports: ["6379:6379"]

  minio:
    image: minio/minio
    command: server /data --console-address ":9009"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    ports: ["9000:9000", "9009:9009"]

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    ports: ["4317:4317", "4318:4318"]

volumes:
  pgdata:
