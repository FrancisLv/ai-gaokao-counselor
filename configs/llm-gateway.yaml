# svc-llm-gateway 启动约束
#
# route（含 allowed_data_classes）/ model allowlist / price table /
# prompt template / response schema 均从 release 绑定的 PostgreSQL 治理记录
# 读取，不在此文件覆盖。
# LLMGW_DSN 由运行环境注入。
server:
  grpc:
    addr: 0.0.0.0:9001
    timeout: 120s
llm:
  database:
    dsn_env: LLMGW_DSN
  provider:
    # fail_closed | deepseek；也可用 LLM_PROVIDER_MODE 覆盖。
    mode: fail_closed
    base_url_env: DEEPSEEK_BASE_URL
    api_key_env: DEEPSEEK_API_KEY
    http_timeout: 60s
